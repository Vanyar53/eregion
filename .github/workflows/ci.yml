name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11; the Docker images run 3.12.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ChromaDB downloads its ONNX embedding model (~80 MB) on first use.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-v1

      - name: Install
        # ruff is pinned in the dev extra: the lint result must not depend on the day.
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests (0 Azure call, 0 LLM call, 0 write in ~/.glorfindel)
        run: python -m pytest tests/ -q

  # The state files are keyed by name; macOS (APFS, case-insensitive by default) is
  # where a VM name with an upper-case letter deleted its own state (fifth review, C1).
  # Linux CI could not see it.
  test-macos:
    name: tests (macOS, case-insensitive file system)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: State and identity tests
        run: python -m pytest tests/unit/test_glorfindel.py tests/unit/test_readiness.py tests/unit/test_reassert.py tests/unit/test_invariants.py -q
