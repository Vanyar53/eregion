name: CI

# CI5 (#512): a pull request runs the Linux suite (200 invariant sequences), the advisories and the
# Terraform tests; macOS, often never acquired by a runner, runs on a push to main and every night
# (the schedule runs it alone), and its red on main opens an issue, or comments the open one.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: read

# CI5: a new push on a pull request cancels the run it replaces. Never on main nor at night: there
# the group is the run itself (its id), so a run is never cancelled nor held pending by another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: lint + tests (py${{ matrix.python-version }})
    # The night is macOS's: the Linux suite runs on each pull request and each push.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    # Bounded, as the macOS job: 11-16 min in one process (CI9, 05/11), less in four (CI10b) —
    # a race of the invariants that never comes back fails in its turn's time (I11), but a
    # hang elsewhere would run six hours (U3F).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11; the Docker images run 3.12.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ChromaDB downloads its ONNX embedding model (~80 MB) on first use.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-v1

      - name: Install
        # The lock (M-3): the versions the image runs, every file checked against its hash;
        # ruff among them — the lint result must not depend on the day. CI8 (#566): the download
        # retried (scripts/retry.sh: three attempts, 10 then 30 s apart, each said); the local
        # install, nothing to fetch, is not.
        run: |
          bash scripts/retry.sh python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .

      # CI8 (#566): ChromaDB's embedding model, fetched before the tests in a step of its own — its
      # download alone retried, never the tests. The cache restored, nothing leaves.
      - name: ChromaDB's embedding model (fetched when the cache misses, retried)
        run: bash scripts/retry.sh python scripts/chroma_model.py

      - name: Lint
        run: ruff check .

      # CI10b (#581, L16): every mutant still applies to this tree, on each pull request and each
      # push — one made stale by another merge is seen at the merge, never at the next release gate
      # (M825, M945 and M1225 were, on main: #299). Under a second, nothing installed for it.
      - name: Mutants anchored to this tree
        run: python scripts/mutant_anchors.py

      # MC0 (A1): no provider SDK outside its adapter (glorfindel/providers/<name>/ in
      # Glorfindel), and every provider declares its capabilities. Named on its own so a
      # breach shows here, before the long tests (which run it again).
      - name: Provider boundary
        run: python -m pytest tests/unit/test_provider_boundary.py -q

      # The failing sequences the nightly run found (tests/unit/test_invariants.py)
      # are replayed first, until fixed. Restore only: the nightly run owns them.
      - uses: actions/cache/restore@v5
        with:
          path: .hypothesis-invariants
          key: invariants-db-
          restore-keys: invariants-db-

      - name: Tests (0 Azure call, 0 LLM call, 0 write in ~/.glorfindel)
        env:
          # CI5: 200 sequences on a pull request, 500 on a push to main; the night's 10 000 are
          # invariants.yml's.
          GLORFINDEL_INVARIANT_EXAMPLES: ${{ github.event_name == 'pull_request' && '200' || '500' }}
          GLORFINDEL_INVARIANT_DB: .hypothesis-invariants
        # CI10b (#581, L8): in four processes (pytest-xdist, from the dev lock), test by test
        # (`--dist load`): the same tests at the same budget, on both Pythons, each process a
        # share of the suite — measured: docs/operations.md, « La CI, plus rapide ».
        # As on macOS: a test still running after 8 min writes every thread's stack to the log —
        # a hang says where it waits before the job's bound.
        run: python -m pytest tests/ -q -n 4 --dist load -o faulthandler_timeout=480

  # SEC14 (P-03): the advisories of the locks on each push and pull request, read only — the issues
  # are pip-audit.yml's, weekly. On a pull request, red only for an advisory with a fixed version
  # that no human accepted (requirements/audit-accepted.json, each with its reason): the bump is
  # due. Without a fix, or accepted, informative; an audit that failed is said, never red. Never
  # red on a push (its step continues on error, the job and its check-run stay green): H0's CD
  # refuses a release whose commit has a red check-run, and an advisory published upstream must
  # not hold back a release that runs the same dependency — the weekly run says it. pip-audit from
  # its own lock, the runner's Python, no third-party action; ubuntu-24.04 pinned as in pip-audit.yml.
  audit:
    name: dependency advisories
    # Never at night: on a schedule it would be red for an advisory, on main's commit — and H0's
    # CD refuses a release whose commit has a red check-run. pip-audit.yml says them weekly.
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false

      # PyPI down during a push must not make H0's CD refuse a release either.
      - name: Install pip-audit
        continue-on-error: ${{ github.event_name == 'push' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/audit"
          bash scripts/retry.sh "$RUNNER_TEMP/audit/bin/pip" install --require-hashes -r requirements/audit.txt

      # The advisory service is asked here, never retried: an audit that failed is said, never red.
      - name: Advisories (red only for one with a fix no one accepted)
        continue-on-error: ${{ github.event_name == 'push' }}
        run: >-
          python3 scripts/pip_audit_issues.py pr --pip-audit "$RUNNER_TEMP/audit/bin/pip-audit"
          --accepted requirements/audit-accepted.json
          requirements/dev.txt requirements/glorfindel.txt requirements/annatar.txt requirements/audit.txt

  # The state files are keyed by name; macOS (APFS, case-insensitive by default) is
  # where a VM name with an upper-case letter deleted its own state (fifth review, C1).
  # Linux CI could not see it.
  # CI5 (#512): on a push to main and every night, never on a pull request — GitHub often never
  # acquires a macOS runner (« The job was not acquired by Runner »), and the sessions' App cannot
  # re-run it. Not a required check any more (docs/operations.md, « La CI, plus rapide »): what it
  # means for a release is said there, never here (H1c, #518).
  test-macos:
    name: tests (macOS, case-insensitive file system)
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    runs-on: macos-latest
    # Bounded: on 28/10 this job hung twice (50 and 28 min, 4-6 min usually) where Linux passed
    # in 2 — a job without a bound runs six hours. Cancelled at its bound, it keeps its log.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          bash scripts/retry.sh python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - uses: actions/cache/restore@v5
        with:
          path: .hypothesis-invariants
          key: invariants-db-
          restore-keys: invariants-db-

      - name: State and identity tests
        env:
          GLORFINDEL_INVARIANT_EXAMPLES: "500"
          GLORFINDEL_INVARIANT_DB: .hypothesis-invariants
          # Here a failure is reported as found: this job checks case-insensitive names, and
          # shrinking a sequence whose races wait up to 20 s each outlasts the job. Linux shrinks.
          GLORFINDEL_INVARIANT_NO_SHRINK: "1"
        # A test still running after 8 min (the whole step takes 3-6) writes every thread's
        # stack to the log: a hang says where it waits before the job's bound cancels it.
        run: python -m pytest tests/unit/test_glorfindel.py tests/unit/test_readiness.py tests/unit/test_reassert.py tests/unit/test_invariants.py tests/unit/test_invariant_regressions.py -q -o faulthandler_timeout=480

  # CI5 (#512): macOS no longer runs on a pull request, so its red on main is the first sign — an
  # issue says it, or a comment on the one still open (by its exact title, opened by this workflow:
  # github-actions). Cancelled counts as red: a timeout or a runner never acquired says
  # `cancelled`, and nothing cancels a run of main. `issues: write` here
  # alone, never on a pull request, and nothing of the repository runs: no checkout, no action,
  # only gh with this text — it writes no key of the dependency audit's issues (SEC7).
  macos-red:
    name: macOS red on main, an issue
    needs: test-macos
    if: ${{ !cancelled() && (needs.test-macos.result == 'failure' || needs.test-macos.result == 'cancelled') && (github.event_name == 'push' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open the issue, or comment the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "CI : les tests macOS sont rouges sur main"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RESULT: ${{ needs.test-macos.result }}
        run: |
          body="Le job « tests (macOS, case-insensitive file system) » est rouge ou annulé sur main ($EVENT : $RESULT), au commit $SHA : $RUN_URL

          Il ne tourne plus sur les PR (CI5, #512) : ce rouge est le premier signe : relancer le job (l'App ne le peut pas), voir docs/operations.md, « La CI, plus rapide ». Fermer l'issue quand main est vert sur macOS."
          open=$(gh issue list --state open --author app/github-actions --limit 500 --json number,title \
            | python3 -c 'import json, os, sys; print(next((str(i["number"]) for i in json.load(sys.stdin) if i["title"] == os.environ["TITLE"]), ""))')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

  # CI4 (#389): the Terraform tests of the repository (infra/terraform/tests/*.tftest.hcl — ID1,
  # G1), planned against mock providers: no Azure identifier, no token, nothing applied. Every
  # provider package comes from the registry and is checked against the hashes of its module's
  # committed lock file (-lockfile=readonly: a package that does not match, or a provider the
  # lock does not list, fails init). Glorfindel's host module has its own test since SEC11 (the
  # session drain, VM by VM: infra/glorfindel-host/tests/); Orodruin's since CI7 (#554: the watch
  # channel's writers, WC1, and Microsoft Graph's reads, IDI1 — infra/orodruin/tests/).
  terraform-test:
    name: terraform test (mock providers)
    if: ${{ github.event_name != 'schedule' }}   # the night is macOS's (CI5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No call to HashiCorp's checkpoint service (version and advisory lookups): nothing leaves
      # the job but the registry downloads the lock checks.
      CHECKPOINT_DISABLE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
      # Terraform at the version pinned here, from HashiCorp's apt repository. Its key is
      # trusted only if it is HashiCorp's, as the canary does (canary-azurerm.yml): the
      # fingerprint of « Linux repositories and packages », https://www.hashicorp.com/en/trust/security
      # (read on 2026-10-28). Otherwise the job fails, nothing installed.
      - name: Install Terraform (HashiCorp's apt repository, pinned)
        env:
          HASHICORP_APT_FPR: D55C0D1AC78A8D8126CB631CFC9CA96ACA026560
          TERRAFORM_VERSION: 1.14.9-1
        run: |
          key="$RUNNER_TEMP/hashicorp.gpg"
          # CI8 (#566): the downloads retried (scripts/retry.sh), the key's check never.
          bash scripts/retry.sh curl -fsSL -o "$RUNNER_TEMP/hashicorp.asc" https://apt.releases.hashicorp.com/gpg
          gpg --batch --yes --dearmor -o "$key" "$RUNNER_TEMP/hashicorp.asc"
          # One primary key, and that fingerprint is its own — a subkey's fpr line has the same form.
          if ! gpg --batch --show-keys --with-colons "$key" \
               | awk -F: -v f="$HASHICORP_APT_FPR" '$1=="pub"{n++;p=1;next} $1=="fpr"&&p{k=$10;p=0} END{exit !(n==1&&k==f)}'; then
            echo "::error::HashiCorp's apt key is not the one primary key ${HASHICORP_APT_FPR} — Terraform not installed."
            exit 1
          fi
          ring="$RUNNER_TEMP/hashicorp.kbx"
          gpg --batch --no-default-keyring --keyring "$ring" --import "$key"
          gpg --batch --no-default-keyring --keyring "$ring" --export "$HASHICORP_APT_FPR" \
            | sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list > /dev/null
          # A transient error on an index fails the update (apt-get --error-on=any): retried, never a W: and 0.
          bash scripts/retry.sh sudo apt-get update -qq -o APT::Update::Error-Mode=any
          bash scripts/retry.sh sudo apt-get install -y -qq "terraform=${TERRAFORM_VERSION}"
          terraform version

      # CI8 (#566): the providers' download in a step of its own, retried; the test never.
      - name: Terraform init — Celebrimbor (the locked providers, retried)
        run: bash scripts/retry.sh terraform -chdir=infra/terraform init -backend=false -lockfile=readonly -input=false -no-color

      - name: Terraform test — Celebrimbor (mock providers)
        run: |
          terraform -chdir=infra/terraform test -no-color

      # CI8 (#566): the providers' download in a step of its own, retried; the test never.
      - name: Terraform init — Glorfindel's host (the locked providers, retried)
        run: bash scripts/retry.sh terraform -chdir=infra/glorfindel-host init -backend=false -lockfile=readonly -input=false -no-color

      - name: Terraform test — Glorfindel's host (mock providers)
        run: |
          terraform -chdir=infra/glorfindel-host validate -no-color
          terraform -chdir=infra/glorfindel-host test -no-color

      # CI8 (#566): the providers' download in a step of its own, retried; the validation never.
      - name: Terraform init — Orodruin (the locked providers, retried)
        run: bash scripts/retry.sh terraform -chdir=infra/orodruin init -backend=false -lockfile=readonly -input=false -no-color

      - name: Terraform test — Orodruin (mock providers)
        run: |
          terraform -chdir=infra/orodruin validate -no-color
          terraform -chdir=infra/orodruin test -no-color
