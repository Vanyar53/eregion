name: Mutants

# Measures the invariant tests: re-introduces, one at a time, bugs Glorfindel really
# had (scripts/mutation_check.py). Red when fewer than `min_caught` are caught in every
# round — the invariants lost strength. 15 of 17 at the push budget on 2026-10-12.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      examples:
        description: "Sequences per run"
        default: "1000"
      rounds:
        description: "Rounds per mutant (new seeds each)"
        default: "2"
      min_caught:
        description: "Fewest mutants caught in every round"
        default: "14"

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    # 93 min on 2026-10-26; MC1 adds 24 mutants that run the machine on AWS (and its
    # unit cases): 180 leaves room.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .

      # The inputs go through the environment, never into the script's text (SEC6,
      # tests/unit/test_workflows.py): a value is a value, not shell.
      - name: Re-introduce each bug, run the invariants
        env:
          MIN_CAUGHT: ${{ inputs.min_caught || '14' }}
          EXAMPLES: ${{ inputs.examples || '1000' }}
          ROUNDS: ${{ inputs.rounds || '2' }}
        run: >-
          python scripts/mutation_check.py --jobs 4 --min-caught "$MIN_CAUGHT"
          --examples "$EXAMPLES" --rounds "$ROUNDS"
