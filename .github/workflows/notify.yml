name: Notify

# N1 (#242): the workshop's news in Discord (docs/atelier-discord.md). #ci: a pull request
# opened or merged, a red run (pull request, main, nightly), main green again after red, a
# closed issue; a lot's events in its #lots thread too. #releases (REL2): the version's pull
# request (chore/release-X.Y.Z, this repository's own) opened and merged, a published release
# (and, on #agents, its draft's line and ping deleted: REL1) — in #ci, as before, while
# #releases' secret is not set. What is worth
# saying is decided by scripts/notify_discord.py (`github`), from the event's JSON.
#
# Never checks out nor runs a pull request's code: pull_request_target and workflow_run run
# the default branch's files, and the script only reads the event. A fork's pull request, and
# its red run (a workflow_run whose head is the fork's), are announced in #ci (the title as inert
# text: no mention parsed, nothing put into `run:`), never in a lot's thread; an issue closed
# whose author holds no role in the repository neither tags nor archives a lot's thread (SEC6).
# Without the secrets (before the setup) it sends nothing and the job stays
# green; a Discord error is one line in the log, without the URL or the token, and the job
# stays green too. A `release` event runs the workflow of the tag's commit: a release tagged
# before this file existed is not announced.
on:
  workflow_run:
    workflows: [CI, Components, Images, "Invariants (deep)", Mutants, canary-azurerm, "Dependency audit"]
    types: [completed]
  pull_request_target:
    types: [opened, closed]
  release:
    types: [published]
  issues:
    types: [closed]

permissions:
  contents: read
  actions: read   # the run before, to say « main green again »

# One run at a time: a merge that closes an issue fires pull_request_target and issues together,
# and two runs could each create the lot's thread. Known limit: GitHub keeps ONE pending run per
# group, and a newer one cancels it — with three events at once, the middle one is lost. Its own
# group (roadmap.yml has another): a roadmap run must never cancel a notification.
concurrency:
  group: notify-discord
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned by commit: this job holds the Discord secrets on events a fork can trigger.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/notify_discord.py
            .claude/skills/elrond/palantir.py
            glorfindel/chat_text.py
          sparse-checkout-cone-mode: false

      - name: Discord
        env:
          EREGION_DISCORD_WEBHOOK_CI: ${{ secrets.EREGION_DISCORD_WEBHOOK_CI }}
          # REL1: a published release deletes its draft's line and ping on #agents (the board's
          # webhook: it edits and deletes only its own messages). Given to release events only.
          EREGION_DISCORD_WEBHOOK_AGENTS: ${{ github.event_name == 'release' && secrets.EREGION_DISCORD_WEBHOOK_AGENTS || '' }}
          # REL2: #releases, a release's story. Given to the events that tell it only: the
          # release, and the version's pull request (pull_request_target; a fork's stays in #ci).
          # glorfindel/chat_text.py (sparse checkout above) makes its notes and titles inert (SEC6).
          EREGION_DISCORD_WEBHOOK_RELEASES: ${{ (github.event_name == 'release' || github.event_name == 'pull_request_target') && secrets.EREGION_DISCORD_WEBHOOK_RELEASES || '' }}
          EREGION_DISCORD_BOT_TOKEN: ${{ secrets.EREGION_DISCORD_BOT_TOKEN }}
          EREGION_DISCORD_LOTS_FORUM: ${{ secrets.EREGION_DISCORD_LOTS_FORUM }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/notify_discord.py github
