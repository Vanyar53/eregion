name: Notify

# N1 (#242): the workshop's news in Discord (docs/atelier-discord.md). #ci: a pull request
# opened or merged, a red run (pull request, main, nightly), main green again after red, a
# published release, a closed issue; a lot's events in its #lots thread too. What is worth
# saying is decided by scripts/notify_discord.py (`github`), from the event's JSON.
#
# Never checks out nor runs a pull request's code: pull_request_target and workflow_run run
# the default branch's files, and the script only reads the event. Without the secrets (a
# fork, or before the setup) it sends nothing and the job stays green; a Discord error is one
# line in the log, without the URL or the token, and the job stays green too.
on:
  workflow_run:
    workflows: [CI, Components, "Invariants (deep)", Mutants, canary-azurerm]
    types: [completed]
  pull_request_target:
    types: [opened, closed]
  release:
    types: [published]
  issues:
    types: [closed]

permissions:
  contents: read
  actions: read   # the run before, to say « main green again »

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/notify_discord.py
            .claude/skills/elrond/palantir.py
          sparse-checkout-cone-mode: false

      - name: Discord
        env:
          ATELIER_WEBHOOK_CI: ${{ secrets.ATELIER_WEBHOOK_CI }}
          ATELIER_BOT_TOKEN: ${{ secrets.ATELIER_BOT_TOKEN }}
          ATELIER_LOTS_FORUM: ${{ secrets.ATELIER_LOTS_FORUM }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/notify_discord.py github
