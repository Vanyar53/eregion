name: Dependency audit

# CI2 (#268): the advisories of the three locks (requirements/dev.txt, glorfindel.txt, annatar.txt),
# and of pip-audit's own (audit.txt: it runs in a job that writes issues), one issue per
# advisory, label `security` (scripts/pip_audit_issues.py), opened by the workflow (only its own
# issues are read back). pip-audit reads each lock as it is (`--require-hashes --disable-pip`):
# nothing is resolved, only the advisory service is asked. Never a pull request: a bump goes through `make lock`, then the harness (Jonathan) —
# docs/operations.md, « Verrou des dépendances ».
#
# Red when a human has something new to see (an issue opened or reopened, an advisory back) or
# an audit failed: notify.yml announces a red scheduled run in #ci — an issue opened with the
# workflow's token triggers no workflow, so the run says it. No secret: the repository's token,
# issues written, contents read.
on:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pip-audit
  cancel-in-progress: false

jobs:
  audit:
    # Pinned: pip-audit evaluates the locks' markers for the runner's Python (3.12 here, the
    # image's); a moving ubuntu-latest would change what is read, silently.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false

      # pip-audit from its own lock, every file checked against its hash, in a venv of its own:
      # the runner's Python, no third-party action.
      - name: Install pip-audit
        run: |
          python3 -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/pip" install --require-hashes -r requirements/audit.txt

      - name: Audit the locks, one issue per advisory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          python3 scripts/pip_audit_issues.py issues --pip-audit "$RUNNER_TEMP/audit/bin/pip-audit"
          requirements/dev.txt requirements/glorfindel.txt requirements/annatar.txt requirements/audit.txt
