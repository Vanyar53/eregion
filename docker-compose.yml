# make glorfindel-start  →  watch + la console d'Eregion (service war-room) sur http://localhost:7007

# M-3 (#183) : chaque conteneur ne reçoit que ses secrets. docker compose lit `.env` (sur H0,
# host.env poussé) pour remplacer les ${…} ci-dessous, et rien d'autre : un conteneur ne voit
# que les variables de sa liste `environment`. Les blocs :
#   env     : réglages sans secret, pour les trois ;
#   azure   : le principal de service (vide sur H0 : l'identité managée) — watch, console
#             (« Approve & execute ») et bot (boutons Restore / Revert) ;
#   models  : les clés des modèles — la watch seule (décisions, rapport de campagne) ;
#   webhook : son URL porte un jeton — watch et console (cartes enregistrées) ; avec elle,
#             GLORFINDEL_DISCORD_BOT, "1" si DISCORD_BOT_TOKEN est posé, "" sinon (jamais sa
#             valeur) : avec DISCORD_CHANNEL_ID, le bot poste les cartes et leur webhook se tait
#             (escalations.discord_bot_configured) ; un salon sans jeton, le webhook poste ;
# le jeton du bot et ses listes d'autorisés : le bot seul ; le jeton de la console : elle seule.
# tests/unit/test_glorfindel_host.py tient cette répartition.
x-env: &env
  AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
  AZURE_WORKSPACE_ID: ${AZURE_WORKSPACE_ID:-}
  AZURE_VM_RESOURCE_ID: ${AZURE_VM_RESOURCE_ID:-}
  GLORFINDEL_LLM_MODEL: ${GLORFINDEL_LLM_MODEL:-}   # empty → eregion_core/models.py ; la War Room l'affiche
  GLORFINDEL_LLM_BASE_URL: ${GLORFINDEL_LLM_BASE_URL:-}
  DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
  GLORFINDEL_ISOLATION_TTL_H: ${GLORFINDEL_ISOLATION_TTL_H:-}
  GLORFINDEL_INCIDENT_TTL_S: ${GLORFINDEL_INCIDENT_TTL_S:-}
  GLORFINDEL_READ_ONLY: ${GLORFINDEL_READ_ONLY:-}
  # G2 : les réglages qui retiennent ou bornent — vide = le défaut de leur lecteur
  # (seuil 0.7, appel au modèle borné à 120 s, carte approuvable 2 h).
  GLORFINDEL_CONFIDENCE_THRESHOLD: ${GLORFINDEL_CONFIDENCE_THRESHOLD:-}
  GLORFINDEL_LLM_TIMEOUT_S: ${GLORFINDEL_LLM_TIMEOUT_S:-}
  GLORFINDEL_APPROVAL_MAX_AGE_H: ${GLORFINDEL_APPROVAL_MAX_AGE_H:-}
  # D-1 : tirages qui doivent s'accorder avant une action disruptive autonome (vide = 3).
  GLORFINDEL_DECISION_DRAWS: ${GLORFINDEL_DECISION_DRAWS:-}
  GLORFINDEL_DISCOVERY_RETENTION_H: ${GLORFINDEL_DISCOVERY_RETENTION_H:-}
  GLORFINDEL_BACKUP_VAULT: ${GLORFINDEL_BACKUP_VAULT:-}
  # O1 : le canal des fenêtres d'exercice d'Orodruin (eregion_core/exercise_channel.py).
  EREGION_EXERCISE_CHANNEL: ${EREGION_EXERCISE_CHANNEL:-}
  # #159 : le canal retour — la watch hébergée y publie battement de cœur et détections.
  EREGION_WATCH_CHANNEL: ${EREGION_WATCH_CHANNEL:-}
  # IA0 (#167) : le modèle d'analyse du rapport de campagne écrit par la watch (vide → défaut).
  EREGION_ANALYSIS_MODEL: ${EREGION_ANALYSIS_MODEL:-}
  # Review 6 : borne d'un appel au modèle d'analyse, par tentative (vide → 300 s).
  EREGION_ANALYSIS_TIMEOUT_S: ${EREGION_ANALYSIS_TIMEOUT_S:-}
  ORT_LOGGING_LEVEL_DEFAULT: "3"

x-azure: &azure
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}

x-models: &models
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  AZURE_API_KEY: ${AZURE_API_KEY:-}
  AZURE_API_BASE: ${AZURE_API_BASE:-}
  AZURE_API_VERSION: ${AZURE_API_VERSION:-}

x-webhook: &webhook
  GLORFINDEL_WEBHOOK_URL: ${GLORFINDEL_WEBHOOK_URL:-}
  GLORFINDEL_DISCORD_BOT: ${DISCORD_BOT_TOKEN:+1}

services:
  watch:
    image: eregion-glorfindel
    container_name: eregion-watch
    command: glorfindel watch /app/runs
    restart: unless-stopped
    environment:
      <<: [*env, *azure, *models, *webhook]
    volumes:
      - ./runs:/app/runs
      # P1 : la base livrée des règles, en lecture seule — aucun conteneur ne l'écrit plus.
      # Les règles du client (approuvées, remplacées, désactivées) vivent dans la couche du
      # client, ~/.glorfindel/client_rules.yaml (montage suivant), hors du dépôt : un
      # redéploiement ne la touche jamais.
      - ./glorfindel/rules:/app/glorfindel/rules:ro
      - ${HOME}/.glorfindel:/root/.glorfindel
      - ${HOME}/.cache/chroma:/root/.cache/chroma
      # IA0 (#167) : l'index campaign_runs du rapport de campagne, sur le disque de l'hôte.
      - ${HOME}/.eregion/analysis:/root/.eregion/analysis
      - ./glorfindel-config.yaml:/app/glorfindel-config.yaml:ro
      - ./technique_catalog.yaml:/app/technique_catalog.yaml:ro
    develop:
      watch:
        - action: rebuild
          path: ./glorfindel
          ignore:
            - ./glorfindel/rules
        - action: rebuild
          path: ./analysis
        - action: rebuild
          path: ./annatar
        - action: rebuild
          path: ./pyproject.toml

  # Bot Discord (escalades dans des fils par VM, boutons). Profil `bot` : ne démarre que si on
  # le demande (`docker compose --profile bot up -d`, ce que fait la VM de Glorfindel, H0) —
  # un seul bot par DISCORD_BOT_TOKEN. Avec le jeton et DISCORD_CHANNEL_ID définis, le webhook
  # des escalades se tait (GLORFINDEL_DISCORD_BOT, bloc webhook) : ce profil doit alors tourner.
  bot:
    image: eregion-glorfindel
    container_name: eregion-bot
    command: glorfindel bot
    restart: unless-stopped
    profiles: ["bot"]
    environment:
      <<: [*env, *azure]
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_PING_ROLE: ${DISCORD_PING_ROLE:-}
      # M-3 : qui peut cliquer les boutons (ids Discord). Vides : tous refusent (fermé par défaut).
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_ALLOWED_ROLES: ${DISCORD_ALLOWED_ROLES:-}
    volumes:
      - ./runs:/app/runs
      - ./glorfindel/rules:/app/glorfindel/rules:ro
      - ${HOME}/.glorfindel:/root/.glorfindel
      - ${HOME}/.cache/chroma:/root/.cache/chroma
      - ./glorfindel-config.yaml:/app/glorfindel-config.yaml:ro
      - ./technique_catalog.yaml:/app/technique_catalog.yaml:ro
    depends_on:
      - watch

  # The Eregion console (`eregion console`, docs/design/console.md). The service keeps the War
  # Room's name for now: H0's deploy.sh and status.sh start and read it by that name.
  war-room:
    image: eregion-glorfindel
    container_name: eregion-war-room
    # 0.0.0.0 INSIDE the container is required for the port mapping to work; what
    # limits exposure is the HOST side of the mapping: loopback only. To reach the
    # console from another machine, set EREGION_CONSOLE_TOKEN and widen the mapping.
    command: eregion console --host 0.0.0.0 --port 7007
    restart: unless-stopped
    ports:
      - "127.0.0.1:7007:7007"
    environment:
      <<: [*env, *azure, *webhook]
      # The console's token; its former name still works (H0's host.env has only that one):
      # the console takes EREGION_CONSOLE_TOKEN when it is not empty, else the former.
      EREGION_CONSOLE_TOKEN: ${EREGION_CONSOLE_TOKEN:-}
      GLORFINDEL_WARROOM_TOKEN: ${GLORFINDEL_WARROOM_TOKEN:-}
    volumes:
      - ./runs:/app/runs
      - ./eregion_console/static:/app/eregion_console/static:ro
      - ./glorfindel/rules:/app/glorfindel/rules:ro
      - ${HOME}/.glorfindel:/root/.glorfindel
      - ${HOME}/.cache/chroma:/root/.cache/chroma
      # Optional: mount glorfindel-config.yaml if it exists
      - ./glorfindel-config.yaml:/app/glorfindel-config.yaml
      - ./technique_catalog.yaml:/app/technique_catalog.yaml:ro
    depends_on:
      - watch
    develop:
      watch:
        - action: sync
          path: ./eregion_console/static
          target: /app/eregion_console/static
        - action: rebuild
          path: ./eregion_console
          ignore:
            - ./eregion_console/static
        - action: rebuild
          path: ./glorfindel
        - action: rebuild
          path: ./annatar
        - action: rebuild
          path: ./pyproject.toml
