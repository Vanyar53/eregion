# make glorfindel-start  →  watch + la console d'Eregion (service war-room) sur http://localhost:7007

# D1 : les profils d'usage (docs/profils/). Glorfindel (watch + console) est toujours là : il
# démarre sans profil. Les profils compose ajoutent : `bot` (le bot Discord), `annatar` et
# `gothmog` (les injecteurs, lancés à la demande : `docker compose --profile annatar run --rm
# annatar list`). Plusieurs équipes : une instance par équipe (make team-start TEAM=…), que
# nomment EREGION_INSTANCE (conteneurs), EREGION_CONSOLE_PORT, EREGION_RUNS et EREGION_CONFIG —
# vides, ce sont les valeurs d'avant D1 (H0 et ses scripts lisent eregion-watch, eregion-war-room).

# M-3 (#183) : chaque conteneur ne reçoit que ses secrets. docker compose lit `.env` (sur H0,
# host.env poussé) pour remplacer les ${…} ci-dessous, et rien d'autre : un conteneur ne voit
# que les variables de sa liste `environment`. Les blocs :
#   env     : réglages sans secret, pour les trois ;
#   azure   : le principal de service de chacun (V-17, ci-dessous ; vide sur H0 : l'identité
#             managée) — watch, console (« Approve & execute ») et bot (boutons Restore / Revert) ;
#   models  : les clés des modèles — la watch seule (décisions, rapport de campagne) ;
#   webhook : son URL porte un jeton — watch et console (cartes enregistrées) ; avec elle,
#             GLORFINDEL_DISCORD_BOT, "1" si DISCORD_BOT_TOKEN est posé, "" sinon (jamais sa
#             valeur) : avec DISCORD_CHANNEL_ID, le bot poste les cartes et leur webhook se tait
#             (escalations.discord_bot_configured) ; un salon sans jeton, le webhook poste ;
# le jeton du bot et ses listes d'autorisés : le bot seul ; le jeton de la console : elle seule.
# tests/unit/test_glorfindel_host.py tient cette répartition.
x-env: &env
  AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
  AZURE_WORKSPACE_ID: ${AZURE_WORKSPACE_ID:-}
  AZURE_VM_RESOURCE_ID: ${AZURE_VM_RESOURCE_ID:-}
  GLORFINDEL_LLM_MODEL: ${GLORFINDEL_LLM_MODEL:-}   # empty → eregion_core/models.py ; la War Room l'affiche
  GLORFINDEL_LLM_BASE_URL: ${GLORFINDEL_LLM_BASE_URL:-}
  DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
  GLORFINDEL_ISOLATION_TTL_H: ${GLORFINDEL_ISOLATION_TTL_H:-}
  GLORFINDEL_INCIDENT_TTL_S: ${GLORFINDEL_INCIDENT_TTL_S:-}
  GLORFINDEL_READ_ONLY: ${GLORFINDEL_READ_ONLY:-}
  # G2 : les réglages qui retiennent ou bornent — vide = le défaut de leur lecteur
  # (seuil 0.7, appel au modèle borné à 120 s, carte approuvable 2 h).
  GLORFINDEL_CONFIDENCE_THRESHOLD: ${GLORFINDEL_CONFIDENCE_THRESHOLD:-}
  GLORFINDEL_LLM_TIMEOUT_S: ${GLORFINDEL_LLM_TIMEOUT_S:-}
  GLORFINDEL_APPROVAL_MAX_AGE_H: ${GLORFINDEL_APPROVAL_MAX_AGE_H:-}
  # D-1 : tirages qui doivent s'accorder avant une action disruptive autonome (vide = 3).
  GLORFINDEL_DECISION_DRAWS: ${GLORFINDEL_DECISION_DRAWS:-}
  GLORFINDEL_DISCOVERY_RETENTION_H: ${GLORFINDEL_DISCOVERY_RETENTION_H:-}
  GLORFINDEL_BACKUP_VAULT: ${GLORFINDEL_BACKUP_VAULT:-}
  # O1 : le canal des fenêtres d'exercice d'Orodruin (eregion_core/exercise_channel.py).
  EREGION_EXERCISE_CHANNEL: ${EREGION_EXERCISE_CHANNEL:-}
  # #159 : le canal retour — la watch hébergée y publie battement de cœur et détections.
  EREGION_WATCH_CHANNEL: ${EREGION_WATCH_CHANNEL:-}
  # IA0 (#167) : le modèle d'analyse du rapport de campagne écrit par la watch (vide → défaut).
  EREGION_ANALYSIS_MODEL: ${EREGION_ANALYSIS_MODEL:-}
  # Review 6 : borne d'un appel au modèle d'analyse, par tentative (vide → 300 s).
  EREGION_ANALYSIS_TIMEOUT_S: ${EREGION_ANALYSIS_TIMEOUT_S:-}
  ORT_LOGGING_LEVEL_DEFAULT: "3"

# V-17 (SEC7) : un principal par service, au moindre droit (docs/operations.md, « Identités Azure ») :
#   la watch    GLORFINDEL_AZURE_CLIENT_*       lecture + le rôle de la réponse (isoler, lever,
#                                               bloquer, instantané) — jamais le restore ;
#   la console  EREGION_CONSOLE_AZURE_CLIENT_*  lecture + réponse + restore (ce qu'un humain approuve) ;
#   le bot      GLORFINDEL_BOT_AZURE_CLIENT_*   lecture + réponse + restore (Restore, Revert).
# Vide, chacun prend AZURE_CLIENT_* (le principal unique d'avant : rien ne casse). Le repli se tire
# variable par variable : un …_CLIENT_ID sans son …_SECRET mélangerait deux principaux — une paire
# va ensemble, et la watch dit au démarrage une paire incomplète. Sur H0, tout est vide : l'identité
# managée de la VM, lectrice.
x-azure: &azure
  AZURE_CLIENT_ID: ${GLORFINDEL_AZURE_CLIENT_ID:-${AZURE_CLIENT_ID:-}}
  AZURE_CLIENT_SECRET: ${GLORFINDEL_AZURE_CLIENT_SECRET:-${AZURE_CLIENT_SECRET:-}}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  # Les identités de la console et du bot (leurs ids, aucun secret), ajoutées à celles que
  # l'opérateur liste : leurs écritures approuvées dans le journal d'activité sont celles de
  # Glorfindel (AL1), pas une carte du plan de contrôle chacune. Les vides sont ignorés.
  GLORFINDEL_OWN_CALLERS: ${GLORFINDEL_OWN_CALLERS:-},${EREGION_CONSOLE_AZURE_CLIENT_ID:-},${GLORFINDEL_BOT_AZURE_CLIENT_ID:-}

x-console-azure: &console-azure
  AZURE_CLIENT_ID: ${EREGION_CONSOLE_AZURE_CLIENT_ID:-${AZURE_CLIENT_ID:-}}
  AZURE_CLIENT_SECRET: ${EREGION_CONSOLE_AZURE_CLIENT_SECRET:-${AZURE_CLIENT_SECRET:-}}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}

x-bot-azure: &bot-azure
  AZURE_CLIENT_ID: ${GLORFINDEL_BOT_AZURE_CLIENT_ID:-${AZURE_CLIENT_ID:-}}
  AZURE_CLIENT_SECRET: ${GLORFINDEL_BOT_AZURE_CLIENT_SECRET:-${AZURE_CLIENT_SECRET:-}}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}

x-models: &models
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
  AZURE_API_KEY: ${AZURE_API_KEY:-}
  AZURE_API_BASE: ${AZURE_API_BASE:-}
  AZURE_API_VERSION: ${AZURE_API_VERSION:-}

x-webhook: &webhook
  GLORFINDEL_WEBHOOK_URL: ${GLORFINDEL_WEBHOOK_URL:-}
  GLORFINDEL_DISCORD_BOT: ${DISCORD_BOT_TOKEN:+1}

# D1 : les injecteurs, Annatar et Gothmog (profils `annatar` et `gothmog`). Leur principal de
# service est le leur, ANNATAR_AZURE_CLIENT_* (sur un poste : lire, ils y restent passifs), jamais
# celui de Glorfindel ; vide, ils n'ont pas d'identité. Le contrat d'Orodruin (cap, portées des canaux,
# groupe du banc) : vide, le verdict est `passive` — un injecteur n'agit que depuis un Orodruin
# armé (docs/design/orodruin-contract.md) ; ici, sur un poste : valider, lister, --dry-run,
# `gothmog preflight`. Le canal retour : le battement de la watch hébergée (V1).
x-injector: &injector
  AZURE_SUBSCRIPTION_ID: ${AZURE_SUBSCRIPTION_ID:-}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_CLIENT_ID: ${ANNATAR_AZURE_CLIENT_ID:-}
  AZURE_CLIENT_SECRET: ${ANNATAR_AZURE_CLIENT_SECRET:-}
  EREGION_BENCH_RG: ${EREGION_BENCH_RG:-}
  EREGION_MAX_INJECTIONS: ${EREGION_MAX_INJECTIONS:-}
  EREGION_MAX_RUN_S: ${EREGION_MAX_RUN_S:-}
  EREGION_EXERCISE_CHANNEL: ${EREGION_EXERCISE_CHANNEL:-}
  EREGION_CHANNEL_SCOPE: ${EREGION_CHANNEL_SCOPE:-}
  EREGION_WATCH_CHANNEL: ${EREGION_WATCH_CHANNEL:-}
  EREGION_WATCH_CHANNEL_SCOPE: ${EREGION_WATCH_CHANNEL_SCOPE:-}

services:
  watch:
    image: eregion-glorfindel
    container_name: ${EREGION_INSTANCE:-eregion}-watch
    command: glorfindel watch /app/runs
    restart: unless-stopped
    # V-34 (SEC7) : aucune capacité, aucun gain de privilège, la racine en lecture seule. Elle
    # n'écrit que dans ses montages (runs/, ~/.glorfindel, ~/.cache/chroma, ~/.eregion/analysis) et /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: [*env, *azure, *models, *webhook]
    volumes:
      - ${EREGION_RUNS:-./runs}:/app/runs
      # P1 : la base livrée des règles, en lecture seule — aucun conteneur ne l'écrit plus.
      # Les règles du client (approuvées, remplacées, désactivées) vivent dans la couche du
      # client, ~/.glorfindel/client_rules.yaml (montage suivant), hors du dépôt : un
      # redéploiement ne la touche jamais.
      - ./glorfindel/rules:/app/glorfindel/rules:ro
      - ${HOME}/.glorfindel:/root/.glorfindel
      - ${HOME}/.cache/chroma:/root/.cache/chroma
      # IA0 (#167) : l'index campaign_runs du rapport de campagne, sur le disque de l'hôte.
      - ${HOME}/.eregion/analysis:/root/.eregion/analysis
      - ${EREGION_CONFIG:-./glorfindel-config.yaml}:/app/glorfindel-config.yaml:ro
      - ./technique_catalog.yaml:/app/technique_catalog.yaml:ro
    develop:
      watch:
        - action: rebuild
          path: ./glorfindel
          ignore:
            - ./glorfindel/rules
        - action: rebuild
          path: ./analysis
        - action: rebuild
          path: ./annatar
        - action: rebuild
          path: ./pyproject.toml

  # Bot Discord (escalades dans des fils par VM, boutons). Profil `bot` : ne démarre que si on
  # le demande (`docker compose --profile bot up -d`, ce que fait la VM de Glorfindel, H0) —
  # un seul bot par DISCORD_BOT_TOKEN. Avec le jeton et DISCORD_CHANNEL_ID définis, le webhook
  # des escalades se tait (GLORFINDEL_DISCORD_BOT, bloc webhook) : ce profil doit alors tourner.
  bot:
    image: eregion-glorfindel
    container_name: ${EREGION_INSTANCE:-eregion}-bot
    command: glorfindel bot
    restart: unless-stopped
    profiles: ["bot"]
    # V-34 (SEC7) : aucune capacité, aucun gain de privilège, la racine en lecture seule. Il
    # n'écrit que dans ses montages (runs/, ~/.glorfindel, ~/.cache/chroma) et /tmp ; la CLI qu'il lance aussi.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: [*env, *bot-azure]
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_PING_ROLE: ${DISCORD_PING_ROLE:-}
      # M-3 : qui peut cliquer les boutons (ids Discord). Vides : tous refusent (fermé par défaut).
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS:-}
      DISCORD_ALLOWED_ROLES: ${DISCORD_ALLOWED_ROLES:-}
    volumes:
      # runs/ en écriture : ses boutons lancent la CLI de Glorfindel (restore, revert), qui y
      # note l'action (manual_actions.jsonl) pour le fil de la console (SEC3).
      - ${EREGION_RUNS:-./runs}:/app/runs
      - ./glorfindel/rules:/app/glorfindel/rules:ro
      - ${HOME}/.glorfindel:/root/.glorfindel
      - ${HOME}/.cache/chroma:/root/.cache/chroma
      - ${EREGION_CONFIG:-./glorfindel-config.yaml}:/app/glorfindel-config.yaml:ro
      - ./technique_catalog.yaml:/app/technique_catalog.yaml:ro
    depends_on:
      - watch

  # The Eregion console (`eregion console`, docs/design/console.md). The service keeps the War
  # Room's name for now: H0's deploy.sh and status.sh start and read it by that name.
  war-room:
    image: eregion-glorfindel
    container_name: ${EREGION_INSTANCE:-eregion}-war-room
    # 0.0.0.0 INSIDE the container is required for the port mapping to work; what
    # limits exposure is the HOST side of the mapping: loopback only. The console always
    # has a token (EREGION_CONSOLE_TOKEN, else the one it draws at its first start in
    # ~/.glorfindel/console_token: `make console-url`) and answers only under a loopback
    # name. To reach it from another machine: widen the mapping, and list the name it is
    # reached under in EREGION_CONSOLE_HOSTS.
    command: eregion console --host 0.0.0.0 --port 7007
    restart: unless-stopped
    # V-34 (SEC7) : aucune capacité, aucun gain de privilège, la racine en lecture seule. Elle
    # n'écrit que dans ses montages (runs/, ~/.glorfindel, ~/.cache/chroma, la config : réécrite sur
    # place sous verrou, glorfindel/config.py) et /tmp ; la CLI qu'elle lance aussi.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${EREGION_CONSOLE_PORT:-7007}:7007"
    environment:
      <<: [*env, *console-azure, *webhook]
      # The console's token; its former name still works (H0's host.env has only that one):
      # the console takes EREGION_CONSOLE_TOKEN when it is not empty, else the former.
      EREGION_CONSOLE_TOKEN: ${EREGION_CONSOLE_TOKEN:-}
      GLORFINDEL_WARROOM_TOKEN: ${GLORFINDEL_WARROOM_TOKEN:-}
      # The names, besides the loopback ones, the console answers under (comma-separated).
      EREGION_CONSOLE_HOSTS: ${EREGION_CONSOLE_HOSTS:-}
    volumes:
      # runs/ en écriture : la console y note les actions de l'opérateur (manual_actions.jsonl)
      # et la vérification d'une action approuvée, pour le fil (SEC3).
      - ${EREGION_RUNS:-./runs}:/app/runs
      - ./eregion_console/static:/app/eregion_console/static:ro
      - ./glorfindel/rules:/app/glorfindel/rules:ro
      - ${HOME}/.glorfindel:/root/.glorfindel
      - ${HOME}/.cache/chroma:/root/.cache/chroma
      # Optional: mount glorfindel-config.yaml if it exists
      - ${EREGION_CONFIG:-./glorfindel-config.yaml}:/app/glorfindel-config.yaml
      - ./technique_catalog.yaml:/app/technique_catalog.yaml:ro
    depends_on:
      - watch
    develop:
      watch:
        - action: sync
          path: ./eregion_console/static
          target: /app/eregion_console/static
        - action: rebuild
          path: ./eregion_console
          ignore:
            - ./eregion_console/static
        - action: rebuild
          path: ./glorfindel
        - action: rebuild
          path: ./annatar
        - action: rebuild
          path: ./pyproject.toml

  # D1 : Annatar, l'attaque (profil `annatar` : « ma détection marche-t-elle ? »). Jamais sans
  # Glorfindel (V1) : `depends_on` démarre la watch (sans attendre son premier battement : la
  # première minute, l'injecteur peut refuser), et son battement se lit dans
  # ~/.glorfindel/injectors, monté en lecture seule comme son ~/.glorfindel : la watch y écrit
  # son battement, rien d'autre, et Annatar ne lit aucun autre fichier de Glorfindel — les
  # escalades, l'état d'isolation, les règles du client restent hors de portée du rouge (SEC3). runs/ est celui de la watch : elle y lit
  # l'attack_started, et n'en prend que ce qu'un injecteur émet (glorfindel/signal_origin.py).
  # Lancé à la demande, il ne reste pas : `docker compose --profile annatar run --rm annatar <commande>`.
  annatar:
    image: eregion-annatar
    entrypoint: ["annatar"]
    command: ["--help"]
    restart: "no"
    profiles: ["annatar"]
    # V-34 (SEC7) : aucune capacité, aucun gain de privilège, la racine en lecture seule. Il
    # n'écrit que dans ses montages (runs/, ~/.annatar) et /tmp. Ni ~/.eregion/analysis ni
    # ~/.cache/chroma : le rapport de fin de campagne s'écrit dans runs/, et l'index de l'IA
    # d'analyse ne s'ouvre jamais ici — chromadb n'est pas dans l'image des injecteurs
    # (requirements/annatar.txt) ; la watch tient cet index (son montage ~/.eregion/analysis).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *injector
      # Le planificateur de campagne (`annatar campaign plan --llm`), comme sur Orodruin.
      ANNATAR_LLM_MODEL: ${ANNATAR_LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ${EREGION_RUNS:-./runs}:/app/runs
      - ./annatar/scenarios:/app/annatar/scenarios
      - ./scripts:/app/scripts
      - ./technique_catalog.yaml:/app/technique_catalog.yaml:ro
      - ${HOME}/.annatar:/root/.annatar
      - ${HOME}/.glorfindel/injectors:/root/.glorfindel:ro
    depends_on:
      - watch

  # D1 : Gothmog, la panne (profil `gothmog` : « mon infra tient-elle ? »). Même image
  # qu'Annatar (celle des injecteurs sur Orodruin), même règle : jamais sans Glorfindel.
  #   docker compose --profile gothmog run --rm gothmog preflight vm-shutdown
  gothmog:
    image: eregion-annatar
    entrypoint: ["gothmog"]
    command: ["--help"]
    restart: "no"
    profiles: ["gothmog"]
    # V-34 (SEC7) : aucune capacité, aucun gain de privilège, la racine en lecture seule. Il
    # n'écrit que dans runs/ et /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *injector
      EREGION_BENCH_WORKSPACE: ${EREGION_BENCH_WORKSPACE:-}
    volumes:
      - ${EREGION_RUNS:-./runs}:/app/runs
      - ./technique_catalog.yaml:/app/technique_catalog.yaml:ro
      - ${HOME}/.glorfindel/injectors:/root/.glorfindel:ro
    depends_on:
      - watch
