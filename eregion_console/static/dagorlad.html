<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eregion</title>
<link rel="stylesheet" href="/static/console.css">
<style>
  /* Dagorlad (docs/design/console.md, §7): red cards, blue cards, the wires between them, the plan.
     Palette in console.css — no colour outside it. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  button { font-family: var(--font); color: var(--text); }
  button.mini {
    background: var(--bg2); border: 1px solid var(--border); cursor: pointer;
    font-size: 10px; padding: 2px 7px; border-radius: 4px;
  }
  button.mini:hover { border-color: var(--dim); }

  #page-title {
    flex-shrink: 0; padding: 6px 20px; font-size: 11px; color: var(--dim);
    border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 10px;
    background: color-mix(in srgb, var(--red) 6%, var(--bg1));
  }
  #page-title b { color: var(--text); letter-spacing: 1px; }
  #views { flex-shrink: 0; display: flex; gap: 6px; align-items: baseline; padding: 5px 20px;
           border-bottom: 1px solid var(--border); font-size: 11px; }
  #views a { padding: 2px 10px; border: 1px solid transparent; border-radius: 6px; color: var(--dim); text-decoration: none; }
  #views a:hover { color: var(--text); border-color: var(--border); }
  #views a.on { color: var(--text); background: var(--bg2); border-color: var(--border); }
  #views .meta { margin-left: 8px; }

  #board {
    position: relative; flex: 1; min-height: 0; display: grid;
    grid-template-columns: 360px minmax(180px, 1fr) 380px; overflow: hidden;
  }
  .col { display: flex; flex-direction: column; min-height: 0; overflow: hidden; z-index: 1; }
  .col-header {
    padding: 10px 16px 8px; font-size: 10px; font-weight: 700; letter-spacing: 1px;
    border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 10px; align-items: baseline;
    white-space: nowrap;
  }
  #col-red .col-header { color: var(--red); }
  #col-blue .col-header { color: var(--blue); }
  .col-header .count { font-weight: 400; letter-spacing: normal; color: var(--dim); }
  .list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 0; }
  .empty { color: var(--dim); font-size: 11px; padding: 14px 16px; line-height: 1.6; }
  .err { color: var(--red); font-size: 11px; padding: 6px 0; }

  .chip {
    font-size: 9px; font-weight: 700; letter-spacing: .5px; padding: 1px 5px; border-radius: 3px;
    border: 1px solid var(--border); color: var(--dim); white-space: nowrap;
  }
  .c-ok   { color: var(--green);  border-color: color-mix(in srgb, var(--green) 45%, transparent); }
  .c-bad  { color: var(--red);    border-color: color-mix(in srgb, var(--red) 45%, transparent); }
  .c-warn { color: var(--yellow); border-color: color-mix(in srgb, var(--yellow) 45%, transparent); }
  .c-blue { color: var(--blue);   border-color: color-mix(in srgb, var(--blue) 45%, transparent); }
  .r-ok { color: var(--green); } .r-bad { color: var(--red); } .r-warn { color: var(--yellow); }
  .meta { color: var(--dim); font-size: 10px; }

  /* ── Cards ── */
  .rcard, .bcard {
    position: relative; display: flex; flex-direction: column; gap: 4px; width: calc(100% - 28px);
    margin: 0 14px 8px; padding: 8px 12px; text-align: left; cursor: pointer;
    background: var(--bg1); border: 1px solid var(--border); border-radius: 6px; font-size: 12px;
  }
  .rcard:hover, .bcard:hover { border-color: var(--dim); }
  .rcard:focus-visible, .bcard:focus-visible { outline: 1px solid var(--blue); outline-offset: 1px; }
  .rcard.sel { border-color: var(--purple); box-shadow: 0 0 0 1px var(--purple); }
  .rcard.off { opacity: .45; cursor: default; }
  .rid { font-weight: 700; color: var(--purple); }
  .rid.fault { color: var(--orange); }
  .rname { color: var(--text); }
  .rfoot, .bchips { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: 10px; }
  .rexp { color: var(--dim); }
  .handle {
    position: absolute; right: -7px; top: calc(50% - 7px); width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--purple); cursor: crosshair; touch-action: none;
  }
  .handle.fault { border-color: var(--orange); }
  .bcard.armed { border-style: dashed; }
  .bcard.wired { border-color: var(--blue); }
  .bname { font-weight: 700; }
  .bmeta { color: var(--dim); font-size: 10px; }
  .gcard {
    margin: 0 14px 10px; padding: 8px 12px; border: 1px solid var(--blue); border-radius: 6px;
    background: color-mix(in srgb, var(--blue) 7%, var(--bg1)); display: flex; flex-direction: column; gap: 3px;
  }
  .gcard b { color: var(--blue); letter-spacing: 1px; }
  .ocard {
    margin: 0 14px 8px; padding: 6px 12px; border: 1px dashed var(--border); border-radius: 6px;
    color: var(--dim); font-size: 10px;
  }

  /* ── Wires: an SVG over the board, its pills beside ── */
  #wires, #pills { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  #wires { width: 100%; height: 100%; overflow: visible; }
  #wires path { fill: none; stroke-width: 2; }
  #wires .w-ok { stroke: var(--blue); }
  #wires .w-warn { stroke: var(--yellow); }
  #wires .w-fault { stroke: var(--orange); stroke-dasharray: 2 5; stroke-linecap: round; }
  #wires .w-refused { stroke: var(--red); stroke-dasharray: 7 5; }
  #wires .w-wait, #wires .w-drag { stroke: var(--dim); stroke-dasharray: 4 4; }
  .pill {
    position: absolute; transform: translate(-50%, -50%); max-width: 300px; display: flex; gap: 6px;
    align-items: baseline; font-size: 10px; padding: 1px 4px 1px 8px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text); pointer-events: auto;
  }
  .pill .pt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pill .px {
    flex-shrink: 0; background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 10px;
    padding: 0 3px; border-radius: 8px;
  }
  .pill .px:hover { color: var(--red); background: var(--bg2); }
  .pill.w-ok { border-color: var(--blue); }
  .pill.w-warn { border-color: var(--yellow); }
  .pill.w-fault { border-color: var(--orange); }
  .pill.w-refused { border-color: var(--red); color: var(--red); }

  /* ── The plan ── */
  #plan {
    flex-shrink: 0; height: 34vh; min-height: 180px; overflow-y: auto; border-top: 1px solid var(--border);
    background: var(--bg1); padding: 10px 20px; font-size: 11px;
  }
  .plan-head { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
  .plan-head b { letter-spacing: 1px; }
  .checks { display: flex; gap: 6px 18px; flex-wrap: wrap; margin-bottom: 8px; }
  .request { border: 1px solid var(--orange); border-radius: 4px; padding: 6px 8px; margin-bottom: 8px;
             display: grid; gap: 4px; }
  .request code { color: var(--orange); user-select: all; }
  table.t { border-collapse: collapse; width: 100%; }
  table.t td { padding: 4px 8px 4px 0; vertical-align: top; border-top: 1px solid var(--border); }
  table.t td.wrap { white-space: normal; }
  table.t td.ord { color: var(--dim); white-space: nowrap; }
  .warns { color: var(--yellow); font-size: 10px; margin-top: 2px; }
</style>
</head>
<body>

<header id="console-header"></header>

<div id="page-title"></div>
<nav id="views" aria-label="Dagorlad's views">
  <a class="view on" href="/dagorlad">Board</a><a class="view" href="/dagorlad?view=runs">Runs</a>
  <span class="meta">the windows and campaigns of both injectors, and the coverage matrix</span>
</nav>

<main id="board">
  <section class="col" id="col-red" aria-label="Red: techniques and faults">
    <div class="col-header">RED · TECHNIQUES &amp; FAULTS <span class="count" id="red-count"></span></div>
    <div class="list" id="red-list"><div class="empty">…</div></div>
  </section>
  <div id="col-mid"></div>
  <section class="col" id="col-blue" aria-label="Blue: Glorfindel and the enrolled targets">
    <div class="col-header">BLUE · ENROLLED TARGETS <span class="count" id="blue-count"></span></div>
    <div class="list" id="blue-list"><div class="empty">…</div></div>
  </section>
  <svg id="wires" aria-hidden="true"></svg>
  <div id="pills" aria-hidden="true"></div>
</main>

<section id="plan" aria-label="The plan of the wires"></section>

<script src="/static/console.js"></script>
<script src="/static/exercises.js"></script>
<script src="/static/dagorlad.js"></script>
</body>
</html>
