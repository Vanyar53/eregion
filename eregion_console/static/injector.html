<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eregion</title>
<link rel="stylesheet" href="/static/console.css">
<style>
  /* Annatar's and Gothmog's sections (/annatar, /gothmog): one page, filtered by its path.
     Palette in console.css — no colour outside it. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  select {
    background: var(--bg2); border: 1px solid var(--border); color: var(--text);
    font-family: var(--font); font-size: 11px; padding: 2px 6px; border-radius: 6px; outline: none;
  }
  select:hover { border-color: var(--blue); }
  button.mini {
    background: var(--bg2); border: 1px solid var(--border); color: var(--text); cursor: pointer;
    font-family: var(--font); font-size: 10px; padding: 2px 7px; border-radius: 4px;
  }
  button.mini:hover { border-color: var(--dim); }

  #page-title {
    flex-shrink: 0; padding: 6px 20px; font-size: 11px; color: var(--dim);
    border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 10px;
  }
  #page-title b { color: var(--text); letter-spacing: 1px; }
  #page-title.annatar { background: color-mix(in srgb, var(--purple) 6%, var(--bg1)); }
  #page-title.gothmog { background: color-mix(in srgb, var(--orange) 6%, var(--bg1)); }
  .hstat { font-size: 11px; color: var(--dim); white-space: nowrap; }

  main { display: flex; flex: 1; min-height: 0; overflow: hidden; }
  .col { display: flex; flex-direction: column; overflow: hidden; border-right: 1px solid var(--border); }
  .col:last-child { border-right: 0; }
  #col-ex { flex: 1.25; min-width: 0; }
  #col-camp { flex: 1; min-width: 0; }
  #col-side { width: 500px; flex-shrink: 0; }
  .col-header {
    padding: 10px 16px 8px; font-size: 10px; font-weight: 700; letter-spacing: 1px; color: var(--dim);
    border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; gap: 10px; align-items: baseline;
  }
  .col-header .count { font-weight: 400; letter-spacing: normal; }
  .col-header label { margin-left: auto; font-weight: 400; letter-spacing: normal; }
  .list { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .empty { color: var(--dim); font-size: 11px; padding: 18px 16px; line-height: 1.6; }
  .err { color: var(--red); font-size: 11px; padding: 8px 16px; }

  /* ── Rows (windows, campaigns) ── */
  .row { border-bottom: 1px solid var(--border); padding: 7px 14px 7px 12px; border-left: 2px solid transparent; }
  .row:hover { background: var(--bg1); }
  .row.inj-annatar { border-left-color: var(--purple); }
  .row.inj-gothmog { border-left-color: var(--orange); }
  .row.focus { background: color-mix(in srgb, var(--blue) 8%, transparent); }
  .row-head { display: flex; align-items: baseline; gap: 8px; cursor: pointer; min-width: 0; }
  .row-sub { display: flex; align-items: baseline; gap: 8px; margin-top: 3px; font-size: 11px; min-width: 0; flex-wrap: wrap; }
  .exp { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 16ch; }
  .meta { color: var(--dim); font-size: 10px; white-space: nowrap; }
  .meta.tgt { flex: 0 3 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .twist { color: var(--dim); font-size: 10px; width: 10px; flex-shrink: 0; }

  .chip {
    font-size: 9px; font-weight: 700; letter-spacing: .5px; padding: 1px 5px; border-radius: 3px;
    border: 1px solid var(--border); color: var(--dim); white-space: nowrap; flex-shrink: 0;
  }
  a.chip:hover { text-decoration: none; border-color: var(--blue); }
  .c-open    { color: var(--yellow); border-color: color-mix(in srgb, var(--yellow) 45%, transparent); }
  .c-grace   { color: var(--blue);   border-color: color-mix(in srgb, var(--blue) 45%, transparent); }
  .c-closed  { color: var(--dim); }
  .c-lapsed  { color: var(--red);    border-color: color-mix(in srgb, var(--red) 45%, transparent); }
  .c-annatar { color: var(--purple); border-color: color-mix(in srgb, var(--purple) 45%, transparent); }
  .c-gothmog { color: var(--orange); border-color: color-mix(in srgb, var(--orange) 45%, transparent); }
  .c-ok      { color: var(--green);  border-color: color-mix(in srgb, var(--green) 45%, transparent); }
  .c-bad     { color: var(--red);    border-color: color-mix(in srgb, var(--red) 45%, transparent); }
  .c-warn    { color: var(--yellow); border-color: color-mix(in srgb, var(--yellow) 45%, transparent); }
  .c-blue    { color: var(--blue);   border-color: color-mix(in srgb, var(--blue) 45%, transparent); }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .resp { font-size: 11px; }
  .r-ok { color: var(--green); } .r-bad { color: var(--red); } .r-warn { color: var(--yellow); }
  .r-wait { color: var(--dim); } .r-blue { color: var(--blue); }

  /* ── Detail (expanded) ── */
  .detail { margin: 6px 0 2px 18px; font-size: 10px; display: flex; flex-direction: column; gap: 6px; }
  .dsec { border-left: 2px solid var(--border); padding: 3px 8px; }
  .dsec.s-blue { border-color: var(--blue); }
  .dsec.s-purple { border-color: var(--purple); }
  .dsec.s-orange { border-color: var(--orange); }
  .dsec.s-green { border-color: var(--green); }
  .dtitle { color: var(--dim); font-weight: 700; letter-spacing: .5px; margin-bottom: 2px; }
  table.t { border-collapse: collapse; width: 100%; }
  table.t td, table.t th { padding: 1px 6px 1px 0; text-align: left; white-space: nowrap; vertical-align: top; }
  table.t th { color: var(--dim); font-weight: 400; }
  table.t td.wrap { white-space: normal; }
  .kv { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .kv span b { color: var(--dim); font-weight: 400; }
  pre.report {
    white-space: pre-wrap; word-break: break-word; font-family: var(--font); font-size: 10px;
    color: var(--text); background: var(--bg1); border: 1px solid var(--border); border-radius: 4px;
    padding: 8px; max-height: 420px; overflow-y: auto;
  }

  /* ── Side column: the coverage matrix (C1) — the catalogue's techniques or faults, each with
     its last outcomes and the age of its last proof; a regressed row in red ── */
  .cat-group { padding: 6px 14px 2px; font-size: 9px; font-weight: 700; letter-spacing: 1px; color: var(--dim); }
  .cat { display: grid; grid-template-columns: 12px 78px 1fr auto 9ch; gap: 6px; align-items: baseline;
         padding: 2px 14px 2px 12px; font-size: 11px; cursor: pointer; border-left: 2px solid transparent; }
  .cat:hover { background: var(--bg1); }
  .cat.planned { opacity: .45; }
  .cat.st-regressed { border-left-color: var(--red); background: color-mix(in srgb, var(--red) 9%, transparent); }
  .cat.st-stale { border-left-color: color-mix(in srgb, var(--red) 55%, transparent); }
  .cat .hist { font-size: 10px; letter-spacing: 1px; white-space: nowrap; }
  .cat .last { text-align: right; }
  .evo { padding: 6px 14px; font-size: 10px; color: var(--dim); border-bottom: 1px solid var(--border);
         display: flex; gap: 10px; align-items: baseline; }
  .evo .bars { font-size: 13px; letter-spacing: 1px; }
  .mdetail { margin: 0 14px 6px 32px; padding: 3px 8px; font-size: 10px; border-left: 2px solid var(--border);
             display: flex; flex-direction: column; gap: 2px; }
  .mdetail .k { color: var(--dim); display: inline-block; width: 9ch; }
  .cat .id { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .cat .nm small { color: var(--dim); }
  .cat .last { font-size: 10px; white-space: nowrap; }

  /* ── Not set up here: what this injector would add ── */
  #setup { flex: 1; overflow-y: auto; padding: 24px 28px; font-size: 12px; line-height: 1.6; }
  #setup h2 { font-size: 13px; letter-spacing: 1px; margin-bottom: 14px; display: flex; gap: 12px; align-items: baseline; }
  #setup h2 small { color: var(--dim); font-weight: 400; letter-spacing: normal; }
  #setup .line { display: grid; grid-template-columns: 130px 1fr; gap: 12px; padding: 5px 0; max-width: 980px; }
  #setup .k { color: var(--dim); }
  #setup code { color: var(--blue); }
</style>
</head>
<body>

<header id="console-header"></header>

<div id="page-title"></div>

<main id="main">
  <div class="col" id="col-ex">
    <div class="col-header">EXERCISES <span class="count" id="ex-count"></span>
      <label class="hstat">windows
        <select id="since">
          <option value="24h">24 h</option>
          <option value="7d" selected>7 days</option>
        </select>
      </label></div>
    <div class="list" id="ex-list"><div class="empty">…</div></div>
  </div>
  <div class="col" id="col-camp">
    <div class="col-header">CAMPAIGNS <span class="count" id="camp-count"></span>
      <label class="hstat">on this host once over ·
        <select id="camp-since">
          <option value="7d">7 days</option>
          <option value="30d" selected>30 days</option>
          <option value="all">all</option>
        </select>
      </label></div>
    <div class="list" id="camp-list"><div class="empty">…</div></div>
  </div>
  <div class="col" id="col-side">
    <div class="col-header"><span id="cat-title"></span> <span class="count" id="cat-count"></span></div>
    <div class="list" id="cat-list"><div class="empty">…</div></div>
  </div>
</main>

<div id="setup" hidden></div>

<script src="/static/console.js"></script>
<script src="/static/exercises.js"></script>
<script src="/static/injector.js"></script>
</body>
</html>
