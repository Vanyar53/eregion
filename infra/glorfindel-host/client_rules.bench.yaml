# La couche du client du banc (WL1, #595) : les règles que le Glorfindel hébergé (H0) charge
# par-dessus la base livrée, dans son ~/.glorfindel/client_rules.yaml. Jamais copiée telle quelle
# sur H0 : `make glorfindel-host-client-rules` y fond chacune de ces règles, par son nom, à côté
# des règles approuvées sur H0 (infra/glorfindel-host/README.md, « La couche du client du banc »).
#
# Ces commentaires ne survivent pas à la fusion (la couche est réécrite) : ce qu'il faut savoir
# d'une règle est dans sa description et dans les commentaires de sa requête.
#
# sudo-privilege-escalation : la règle livrée (glorfindel/rules/azure/detection_rules.yaml),
# recopiée à l'identique, plus une exclusion — la maintenance programmée de bree
# (infra/terraform/scripts/workload.sh). Décision de Jonathan, 06/11. `base_sha256` est
# l'empreinte de la règle livrée entière d'où vient la copie (detection_rules.base_rule_sha256) :
# quand la base change, la watch écarte la copie et dit la dérive — la règle livrée tourne, et la
# carte de la maintenance de bree revient ; tests/unit/test_bench_routine.py échoue tant que la
# copie n'est pas refaite.
# Aucun identifiant réel : le nom de bree et de son groupe sont ceux du banc, déjà dans le dépôt.

rules:
  - name: sudo-privilege-escalation
    description: "Successful sudo to root by a non-root user — T1548.003 (banc : sans la maintenance programmée de bree, WL1)"
    enabled: true
    ttp: T1548.003
    assets: [auto]
    interval_s: 30
    expected_latency_s: 480
    base_sha256: 16dadd6722068e4a77c64b6f7e431f63db2a5cdf198887bea82f8a4bf829dd0a
    query: |
      Syslog
      // sudo logs to authpriv (measured under AMA); auth kept for the hosts that route it there.
      | where Facility in ("auth", "authpriv")
      | where TimeGenerated > ago(10m)
      // Lines tagged sudo only (SEC2), in sudo's form: `<user> : TTY=… ; PWD=… ; USER=root ;
      // … COMMAND=…` (TTY absent without a terminal). The fields are separated by « ; » or,
      // as the agent writes them, by spaces. A failure (`3 incorrect password attempts ; …`)
      // is no escalation.
      | where ProcessName == "sudo"
      | where SyslogMessage has "USER=root"
            and SyslogMessage has "COMMAND="
      | where SyslogMessage matches regex @"^\s*\S+ : (TTY|PWD)=(.*[ ;])?USER=root[ ;]+(.*[ ;])?COMMAND="
      | where SyslogMessage !has "NOT in sudoers"
            and SyslogMessage !has "authentication failure"
      // WL1 (#595), the bench only: bree's scheduled maintenance (infra/terraform/scripts/workload.sh,
      // /etc/cron.d/eregion-workload), benign noise kept on purpose for H0's pre-observation. Set
      // aside only when everything holds: bree (its host name and its resource), the account
      // celebrimbor, no terminal (no TTY=, sudo's form outside a terminal), to root with nothing
      // between USER= and COMMAND= (no GROUP=, no ENV=), one of these three commands with exactly
      // these arguments, nothing after. Fields separated by « ; » or by spaces (the agent's form).
      // Anything else — another account, a terminal, another command or argument, another VM —
      // is a card, as with the shipped rule.
      | where not(Computer == "vm-celebrimbor-bree"
            and _ResourceId endswith "/resourcegroups/rg-celebrimbor/providers/microsoft.compute/virtualmachines/vm-celebrimbor-bree"
            and SyslogMessage matches regex @"^ *celebrimbor : PWD=[^ ;]+( ; | +)USER=root( ; | +)COMMAND=(/usr/sbin/nginx -t|/usr/bin/systemctl reload nginx|/usr/bin/journalctl --vacuum-time=14d)$")
      // ProcessName handed on in the row: Glorfindel reads the emitter as this rule does (SEC13).
      | project TimeGenerated, Computer, _ResourceId, ProcessName, SyslogMessage
      // One row per VM and distinct line, not `limit 1`: the limit ran on the server before
      // the per-VM filter, so a benign sudo on another VM hid the attack (third review, T7).
      // Nor one row per VM (ADM1): an administrator's expected sudo, the latest, would hide
      // another account's in the same window — and any local user can write a line tagged
      // sudo. The poller sets the expected ones aside, then sends the newest of the rest.
      | summarize arg_max(TimeGenerated, *) by Computer, _ResourceId, SyslogMessage

  # nsg-change-outside-glorfindel : la règle livrée, recopiée à l'identique, plus une exclusion — le
  # canari azurerm (infra/canary/jit-terraform/, .github/workflows/canary-azurerm.yml), qui crée puis
  # supprime ses NSG jetables dans rg-eregion-canary sous son propre principal (P-04). Décision de
  # Jonathan, 06/11 (CAN2, #605), après 12 cartes jugées Right. L'appid du principal n'est jamais
  # dans le dépôt : `env_guids` le fait prendre, au chargement, dans l'environnement de la watch
  # (EREGION_RULE_CANARY_APPID, host.env de H0), vérifié GUID ; absent ou invalide, cette copie est
  # écartée et la règle livrée tourne — les cartes du canari reviennent, rien n'est caché.
  - name: nsg-change-outside-glorfindel
    description: "Modification d'un NSG ou d'une de ses règles par un autre appelant que Glorfindel — T1562.007 (Impair Defenses: Disable or Modify Cloud Firewall). Le cas le plus grave : une règle gérée par Glorfindel (isolation, quarantaine, blocage) écrite par un autre. (banc : sans le canari azurerm dans rg-eregion-canary, CAN2)"
    enabled: true
    source: azure_activity
    ttp: T1562.007
    assets: [auto]
    interval_s: 60
    expected_latency_s: 1200
    base_sha256: b1addb6b5f2f7c6de5f77c25ec0079e87523c5fdc8152e83ad1e08b5a8fea14a
    env_guids: [EREGION_RULE_CANARY_APPID]
    query: |
      AzureActivity
      | where TimeGenerated > ago(1h)
      | where OperationNameValue in~ (
          "MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/WRITE",
          "MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/DELETE",
          "MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/SECURITYRULES/WRITE",
          "MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/SECURITYRULES/DELETE")
      | extend CallerAppId = tostring(parse_json(Claims).appid),
               CallerObjectId = tostring(parse_json(Claims)["http://schemas.microsoft.com/identity/claims/objectidentifier"])
      // One row per operation, its latest line (Start, Accept, Success).
      | summarize arg_max(TimeGenerated, *) by CorrelationId, OperationNameValue, _ResourceId
      | where ActivityStatusValue !in~ ("Failure", "Failed")
      // CAN2 (#605), the bench only: the azurerm canary's runs (infra/canary/jit-terraform/), which
      // create and delete their throwaway NSGs in rg-eregion-canary under the canary's own principal.
      // Set aside only when both hold, read on the operation's latest line: the group is
      // rg-eregion-canary (its ResourceGroup column and its resource id, without case, as ARM reads
      // them) and the caller is the canary's principal — its appid, from the watch's environment
      // (EREGION_RULE_CANARY_APPID, checked to be a GUID at load), as the token's application or as
      // the caller, and no user's name as the caller (a user signed in through that application is
      // not its principal). Another caller in that group, or that principal anywhere else: a card,
      // as with the shipped rule.
      | where not(ResourceGroup =~ "rg-eregion-canary"
            and _ResourceId matches regex @"(?i)^/subscriptions/[0-9a-f-]+/resourcegroups/rg-eregion-canary/providers/"
            and (CallerAppId =~ "${EREGION_RULE_CANARY_APPID}" or Caller =~ "${EREGION_RULE_CANARY_APPID}")
            and Caller !contains "@")
      | project TimeGenerated, OperationNameValue, ActivityStatusValue, Caller, CallerIpAddress,
                CallerAppId, CallerObjectId, _ResourceId, ResourceGroup, CorrelationId
