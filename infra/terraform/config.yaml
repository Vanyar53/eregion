# Celebrimbor — Infrastructure de test Eregion
#
# Celebrimbor est le bâtisseur : le seigneur-forgeron d'Eregion (l'univers du repo).
# Annatar (rouge) attaque, Glorfindel (bleu) défend, Celebrimbor construit l'infra.
#
# Ce fichier pilote le module via yamldecode + for_each (cf. locals.tf). L'instance
# est dérivée du WORKSPACE Terraform (`terraform.workspace`) :
#   - workspace "default"  → noms canoniques (rg-celebrimbor, vm-celebrimbor-gondolin…)
#   - workspace "<nom>"    → tout suffixé "-<nom>" (stacks éphémères parallèles, pipelines)
#
#   make celebrimbor-up                       # applique le baseline (+ topos enabled:true)
#   make celebrimbor-up TOPO="multinic,aks"   # n'active QUE ces topos (surcharge enabled)
#   make celebrimbor-up INSTANCE=ci-1234       # stack isolée dans un workspace dédié
#   make celebrimbor-down                      # détruit le workspace courant
#   make celebrimbor-stop / celebrimbor-start        # éteint/rallume les VMs sans détruire

# ── Identité ─────────────────────────────────────────────────────────────────
project:  celebrimbor
location: westeurope

# ── Baseline VM — défauts appliqués à chaque hôte qui ne surcharge pas ────────
vm_size:        Standard_D2as_v6
admin_username: celebrimbor
disk_size_gb:   32
vm_image:       # image des VMs (surcharge par hôte = bloc complet)
  publisher: Canonical
  offer:     0001-com-ubuntu-server-jammy
  sku:       22_04-lts-gen2
  version:   latest
os_disk:        # disque OS des VMs (surcharge par hôte = bloc complet ; type : Standard_LRS / Premium_LRS / StandardSSD_LRS)
  caching:              ReadWrite
  storage_account_type: Standard_LRS

# Assets de test — trois catégories distinctes :
#   vms:        VM IaaS standalone, gouvernée COMME une VM (isolate/backup/snapshot).
#   clusters:   cluster managé (AKS) — asset first-class, gouverné autrement.
#   topologies: forme d'arrangement d'infra jetable pour valider un handling (pas un asset).
# vms + clusters : clé = nom propre Tolkien, format bloc, champ `kind`.
#
# Knobs vms : kind (vm), enabled (défaut true), always_on (défaut false → 24/7,
# pas d'auto-shutdown), vm_size / disk_size_gb (défauts globaux surchargeables).
# gondolin : cité défendue par Glorfindel. himring : forteresse-frontière → honeypot
# (SSH exposé, always_on, opt-in via enabled:true ; ⚠ coût 24/7).
vms:
  gondolin:
    kind: vm
  himring:
    kind:      vm
    enabled:   false
    always_on: true

# Cluster managé ≠ VM IaaS : nœuds VMSS (RG MC_*) non backupables/isolables IaaS →
# Glorfindel groupe par kind/parent + skip posture (cb3593b, 9a7bd59). Futur clusters.tf.
# Knobs : kind (aks seul), enabled (défaut false), node_count, node_size (défaut vm_size),
# location (défaut globale). menegroth : Mille Cavernes → beaucoup de nœuds.
clusters:
  menegroth:
    kind:       aks
    enabled:    false
    node_count: 2
    # node_size: Standard_D4as_v6  # défaut = vm_size global
    # location:  francecentral      # défaut = location globale

# ── Ressources nommées (baseline) ────────────────────────────────────────────
law_name: amonsul # tour de guet (Weathertop) — observation/logs
rsv_name: erebor  # la Montagne au trésor — coffre/sauvegarde

# ── Network ──────────────────────────────────────────────────────────────────
vnet_address_space:    10.10.0.0/16
subnet_address_prefix: 10.10.1.0/24

# ── Backup ───────────────────────────────────────────────────────────────────
vault_storage_mode:    LocallyRedundant
vault_immutability:    Disabled
backup_time:           "02:00"
backup_retention_days: 7

# ── VM auto-shutdown (UTC — minuit Paris = 22:00 UTC été, 23:00 UTC hiver) ─────
vm_shutdown_time:  "2300" # format HHMM UTC
vm_shutdown_email: fontaine.jonathan@proton.me

# ── Monitoring ───────────────────────────────────────────────────────────────
log_retention_days:               30
perf_sampling_frequency:          10
disk_write_alert_threshold_bytes: 52428800 # 50 MB/s

# ── Topologies de test (jetables, enabled:false par défaut) ───────────────────
# PAS un asset : une FORME d'arrangement d'infra montée pour valider un handling
# Glorfindel (multi-NIC, deny NSG subnet, vault cross-RG, multi-LAW…) puis détruite.
# Chaque topo = son propre RG taggé ttl=destroy-after-test. `make celebrimbor-up TOPO=...`
# = override TRANSITOIRE (redescend au prochain apply sans la var, ≠ vms enabled:true).
topologies:

  # 1. VM 2 NICs, 1 NSG par NIC (niveau NIC) → isolation multi-NIC (7603a3e)
  multinic:
    enabled: false

  # 2. VM derrière un NSG de SUBNET (+ voisin) → deny scopé IP, non-impact (957f48e)
  subnet_nsg:
    enabled: false

  # 3. VM 2 NICs — mix NSG NIC + NSG subnet → 2 scopes en une passe
  mix_nsg:
    enabled: false

  # 4. NIC à plusieurs ipConfigs → couverture de toutes les IP (7603a3e)
  multiip:
    enabled: false
    secondary_ips: 1

  # 5. Vault cross-RG (RSV dans son propre RG) → check_backup_points RG du vault (4ba8134)
  vault_cross_rg:
    enabled: false

  # 6. Deux Log Analytics Workspaces → binding règle↔backend multi-LAW (90a0b09)
  two_law:
    enabled: false

  # 7. Deux Recovery Services Vaults → résolution multi-vault (4ba8134/754aea0)
  two_rsv:
    enabled: false
