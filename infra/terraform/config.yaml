# Celebrimbor — Infrastructure de test Eregion
#
# Celebrimbor est le bâtisseur : le seigneur-forgeron d'Eregion (l'univers du repo).
# Annatar (rouge) attaque, Glorfindel (bleu) défend, Celebrimbor construit l'infra.
#
# Ce fichier pilote le module via yamldecode + for_each (cf. locals.tf). L'instance
# est dérivée du WORKSPACE Terraform (`terraform.workspace`) :
#   - workspace "default"  → noms canoniques (rg-celebrimbor, vm-celebrimbor-gondolin…)
#   - workspace "<nom>"    → tout suffixé "-<nom>" (stacks éphémères parallèles, pipelines)
#
#   make celebrimbor-up                       # applique le baseline (+ topos enabled:true)
#   make celebrimbor-up TOPO="multinic,aks"   # n'active QUE ces topos (surcharge enabled)
#   make celebrimbor-up INSTANCE=ci-1234       # stack isolée dans un workspace dédié
#   make celebrimbor-down                      # détruit le workspace courant
#   make celebrimbor-stop / celebrimbor-start        # éteint/rallume les VMs sans détruire

# ── Identité ─────────────────────────────────────────────────────────────────
project:  celebrimbor
location: westeurope

# ── Baseline VM — défauts appliqués à chaque hôte qui ne surcharge pas ────────
vm_size:        Standard_D2as_v6
admin_username: celebrimbor
disk_size_gb:   32

# Trois axes d'assets/infra de test, à ne pas confondre :
#   vms:        VMs IaaS STANDALONE que Glorfindel gouverne COMME des VMs (isolate /
#               backup / snapshot s'appliquent). Assets baseline persistants. ← ICI.
#   clusters:   assets d'un AUTRE type — cluster managé (AKS). First-class comme vms,
#               mais gouverné différemment (groupage kind/parent, posture skip) et
#               provisionné par azurerm_kubernetes_cluster, pas par cette map.
#   topologies: échafaudages d'ARRANGEMENT d'infra (jetables, RG propre + ttl) qui
#               testent le HANDLING de Glorfindel sur une forme (multi-NIC, vault
#               cross-RG, multi-LAW…) — pas de nouveaux types d'asset.
#
# vms = « toute chose que Glorfindel gouverne comme une VM IaaS », PAS « toute chose
# qui est une VM » : les nœuds AKS sont des VMs (VMSS) mais vivent dans clusters:.
#
# La CLÉ = nom propre Tolkien (cités/forteresses). Chaque hôte peut surcharger
# vm_size / disk_size_gb + deux knobs de cycle de vie :
#   enabled   (défaut true)  → false = hôte NON déployé (gate opt-in PERSISTANT :
#             repasser à true = l'hôte reste debout à travers les applies suivants).
#   always_on (défaut false) → true  = pas d'auto-shutdown, la VM tourne 24/7.
# gondolin : la cité cachée trahie et mise à sac — celle que Glorfindel a défendue.
# himring : forteresse-frontière de Maedhros, avant-poste de guet qui attirait les
#   assauts ennemis → HONEYPOT dédié (SSH exposé via le NSG partagé), toujours allumé
#   pour un test long, isolé du cycle de vie de gondolin. enabled:false = opt-in :
#   passe-le à true + `make celebrimbor-up` pour le lever, false + up pour le retirer.
#   ⚠ always_on = coût 24/7 (≈4× une VM en ~6h/jour).
vms:
  gondolin: {}
  himring: { enabled: false, always_on: true }

# ── Clusters managés (assets d'un autre TYPE, sœurs de vms:) ───────────────────
# Un cluster managé est un asset first-class que Glorfindel découvre et gouverne — mais
# PAS comme une VM IaaS : ses nœuds (VMSS, RG managé MC_*) ne sont ni backupables IaaS
# ni NSG-isolables la voie IaaS → Glorfindel les groupe par kind/parent + skip posture
# (cb3593b, 9a7bd59). Ce n'est donc ni un hôte vms: (pas un azurerm_linux_virtual_machine)
# ni une topologie d'arrangement (c'est un type d'asset, pas une forme de NSG).
# Comme vms:, la CLÉ = nom propre Tolkien (asset → petit nom, pas le type générique) ;
# overrides inline. Le type d'orchestrateur est AKS, implicite dans ce module Azure
# (comme un hôte vms: est un Linux VM implicite). Provisionné par un futur clusters.tf.
# menegroth : les Mille Cavernes de Doriath (forteresse aux mille salles) → beaucoup de
#   nœuds. enabled:false = opt-in. node_count = taille du node pool.
clusters:
  menegroth: { enabled: false, node_count: 2 }

# ── Ressources nommées (baseline) ────────────────────────────────────────────
law_name: amonsul # tour de guet (Weathertop) — observation/logs
rsv_name: erebor  # la Montagne au trésor — coffre/sauvegarde

# ── Network ──────────────────────────────────────────────────────────────────
vnet_address_space:    10.10.0.0/16
subnet_address_prefix: 10.10.1.0/24

# ── Backup ───────────────────────────────────────────────────────────────────
vault_storage_mode:    LocallyRedundant
vault_immutability:    Disabled
backup_time:           "02:00"
backup_retention_days: 7

# ── VM auto-shutdown (UTC — minuit Paris = 22:00 UTC été, 23:00 UTC hiver) ─────
vm_shutdown_time:  "2300" # format HHMM UTC
vm_shutdown_email: fontaine.jonathan@proton.me

# ── Monitoring ───────────────────────────────────────────────────────────────
log_retention_days:               30
perf_sampling_frequency:          10
disk_write_alert_threshold_bytes: 52428800 # 50 MB/s

# ── Topologies de test (jetables, toutes enabled:false par défaut) ────────────
# Une topo n'est NI un hôte `vms:` NI un `clusters:` : ce n'est pas un nouveau type
# d'asset, c'est une FORME d'ARRANGEMENT d'infra (autour du même asset VM le plus souvent)
# montée pour valider un chemin de code Glorfindel précis (isolation multi-NIC, deny
# scopé sur NSG de subnet, vault cross-RG, multi-LAW…) puis détruite.
# Un apply de base ne déploie QUE le baseline. Chaque topo = ressources gated par
# `enabled` (for_each), dans son propre RG taggé ttl=destroy-after-test → jetable.
# La surcharge `make celebrimbor-up TOPO=...` passe -var topo_filter (override TRANSITOIRE :
# la topo redescend au prochain apply sans la var — normal pour du jetable, à l'inverse
# d'un hôte vms enabled:true qui, lui, persiste).
topologies:

  # 1. VM 2 NICs, 1 NSG par NIC (niveau NIC) → isolation multi-NIC (7603a3e)
  multinic:
    enabled: false

  # 2. VM derrière un NSG de SUBNET (+ voisin) → deny scopé IP, non-impact (957f48e)
  subnet_nsg:
    enabled: false

  # 3. VM 2 NICs — mix NSG NIC + NSG subnet → 2 scopes en une passe
  mix_nsg:
    enabled: false

  # 4. NIC à plusieurs ipConfigs → couverture de toutes les IP (7603a3e)
  multiip:
    enabled: false
    secondary_ips: 1

  # 5. Vault cross-RG (RSV dans son propre RG) → check_backup_points RG du vault (4ba8134)
  vault_cross_rg:
    enabled: false

  # 6. Deux Log Analytics Workspaces → binding règle↔backend multi-LAW (90a0b09)
  two_law:
    enabled: false

  # 7. Deux Recovery Services Vaults → résolution multi-vault (4ba8134/754aea0)
  two_rsv:
    enabled: false
